apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# kubelet の cAdvisor から、Pod ごとの CPU とメモリを取る。nodes/proxy は kubelet 経由で exec できるので渡さない
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: showcase-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: showcase-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: showcase-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: app-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        # kubelet の証明書は k3s が自分で署名している
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        # 来場者のアプリの CPU、メモリ、通信量だけを残す。全部取るとメモリが足りない
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total)
            action: keep
          - source_labels: [namespace]
            regex: app-.+
            action: keep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0-distroless@sha256:e8b8fb0e336fe0affce6f9ea347b11d24975465fd3ba8119420186679c3efd5f
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
            - --storage.tsdb.retention.size=800MB
            # Grafana の匿名の閲覧者も任意の PromQL を流せる。重いクエリで止まらないようにする
            - --query.timeout=10s
            - --query.max-samples=5000000
            - --query.max-concurrency=4
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - port: 9090
      targetPort: 9090
