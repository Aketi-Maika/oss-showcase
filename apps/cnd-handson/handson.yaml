  labels:
    app: handson-legacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: handson-legacy
  template:
    metadata:
      labels:
        app: handson-legacy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: entry
          image: ghcr.io/cloudnativedaysjp/cnd-handson-app/handson:legacy
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          env:
            - name: PROJECT_ADDR
              value: handson-project:50051
            - name: TASK_ADDR
              value: handson-task:50051
            - name: COLUMN_ADDR
              value: handson-column:50051
            - name: IDP_ADDR
              value: handson-idp:50051
            - name: IDP_JWKS_URL
              value: http://handson-idp:8080/.well-known/jwks.json
            - name: IDP_ISS
              value: "http://handson-idp:8080"
            - name: IDP_AUD
              value: "handson"
            - name: OTEL_SERVICE_NAME
              value: handson-legacy
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=handson,app.variant=legacy,app.color=blue
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
