kind: HTTPRoute
metadata:
  name: handson-entry
spec:
  parentRefs:
    - name: showcase
      namespace: gateway
  hostnames:
    - cnd-handson.showcase.cloudnativedays.jp
  rules:
    - backendRefs:
        - name: handson-legacy
          port: 8080
          weight: 100
        - name: handson-modern
          port: 8080
          weight: 0
