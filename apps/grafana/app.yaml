# Source: grafana/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  namespace: app-grafana
  labels:
    helm.sh/chart: grafana-14.4.1
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/version: "13.3.1"
data:
  
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [auth]
    disable_login_form = true
    [auth.anonymous]
    enabled = true
    org_role = Viewer
    [auth.basic]
    enabled = false
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/default/showcase.json
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [plugins]
    preinstall_auto_update = false
    [server]
    domain = ''
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: TestData
      type: grafana-testdata-datasource
      uid: testdata
    - isDefault: true
      name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus.app-prometheus.svc:9090
    - jsonData:
        database: app
        postgresVersion: 1800
        sslmode: require
      name: PostgreSQL
      secureJsonData:
        password: $GF_READER_PASSWORD
      type: grafana-postgresql-datasource
      uid: postgres
      url: grafana-db-rw:5432
      user: grafana_reader
  dashboardproviders.yaml: |
    apiVersion: 1
    providers:
    - disableDeletion: true
      editable: false
      name: default
      options:
        path: /var/lib/grafana/dashboards/default
      type: file
  download_dashboards.sh: |
    #!/usr/bin/env sh
    set -eufo pipefail
    mkdir -p /var/lib/grafana/dashboards/default
    mkdir -p /var/lib/grafana/dashboards/default
---
# Source: grafana/templates/dashboards-json-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-default
  namespace: app-grafana
  labels:
    helm.sh/chart: grafana-14.4.1
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/version: "13.3.1"
    dashboard-provider: default
data:
  showcase.json:
    |-
      {
        "title": "OSS Showcase",
        "uid": "showcase",
        "refresh": "10s",
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "panels": [
          {
            "type": "timeseries",
            "title": "アプリごとの CPU",
            "gridPos": {
              "x": 0,
              "y": 0,
              "w": 8,
              "h": 9
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "label_replace(sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\"}[2m])), \"app\", \"$1\", \"namespace\", \"app-(.*)\")",
                "legendFormat": "{{app}}"
              }
            ]
          },
          {
            "type": "timeseries",
            "title": "アプリごとのメモリ",
            "gridPos": {
              "x": 8,
              "y": 0,
              "w": 8,
              "h": 9
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "bytes"
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "label_replace(sum by (namespace) (container_memory_working_set_bytes{container!=\"\"}), \"app\", \"$1\", \"namespace\", \"app-(.*)\")",
                "legendFormat": "{{app}}"
              }
            ]
          },
          {
            "type": "timeseries",
            "title": "アプリごとの受信量",
            "gridPos": {
              "x": 16,
              "y": 0,
              "w": 8,
              "h": 9
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "fieldConfig": {
              "defaults": {
                "unit": "Bps"
              }
            },
            "targets": [
              {
                "refId": "A",
                "expr": "label_replace(sum by (namespace) (rate(container_network_receive_bytes_total[2m])), \"app\", \"$1\", \"namespace\", \"app-(.*)\")",
                "legendFormat": "{{app}}"
              }
            ]
          },
          {
            "type": "timeseries",
            "title": "WAIWAI 度（乱数）",
            "gridPos": {
              "x": 0,
              "y": 9,
              "w": 16,
              "h": 8
            },
            "datasource": {
              "type": "grafana-testdata-datasource",
              "uid": "testdata"
            },
            "targets": [
              {
                "refId": "A",
                "scenarioId": "random_walk",
                "seriesCount": 3
              }
            ]
          },
          {
            "type": "gauge",
            "title": "盛り上がり（乱数）",
            "gridPos": {
              "x": 16,
              "y": 9,
              "w": 8,
              "h": 8
            },
            "datasource": {
              "type": "grafana-testdata-datasource",
              "uid": "testdata"
            },
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "max": 100
              }
            },
            "options": {
              "reduceOptions": {
                "calcs": [
                  "lastNotNull"
                ]
              }
            },
            "targets": [
              {
                "refId": "A",
                "scenarioId": "random_walk",
                "min": 0,
                "max": 100,
                "startValue": 50
              }
            ]
          },
          {
            "type": "stat",
            "title": "Grafana の DB の接続数",
            "gridPos": {
              "x": 0,
              "y": 17,
              "w": 6,
              "h": 5
            },
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "postgres"
            },
            "targets": [
              {
                "refId": "A",
                "format": "table",
                "rawQuery": true,
                "editorMode": "code",
                "rawSql": "SELECT count(*) AS \"接続\" FROM pg_stat_activity WHERE datname = 'app'"
              }
            ]
          },
          {
            "type": "stat",
            "title": "Grafana の DB のサイズ",
            "gridPos": {
              "x": 6,
              "y": 17,
              "w": 6,
              "h": 5
            },
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "postgres"
            },
            "targets": [
              {
                "refId": "A",
                "format": "table",
                "rawQuery": true,
                "editorMode": "code",
                "rawSql": "SELECT pg_database_size('app') AS \"サイズ\""
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "bytes"
              }
            }
          },
          {
            "type": "stat",
            "title": "コミットしたトランザクション",
            "gridPos": {
              "x": 12,
              "y": 17,
              "w": 12,
              "h": 5
            },
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "postgres"
            },
            "targets": [
              {
                "refId": "A",
                "format": "table",
                "rawQuery": true,
                "editorMode": "code",
                "rawSql": "SELECT xact_commit AS \"コミット\" FROM pg_stat_database WHERE datname = 'app'"
              }
            ]
          },
          {
            "type": "table",
            "title": "行の多いテーブル",
            "gridPos": {
              "x": 0,
              "y": 22,
              "w": 24,
              "h": 8
            },
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "postgres"
            },
            "targets": [
              {
                "refId": "A",
                "format": "table",
                "rawQuery": true,
                "editorMode": "code",
                "rawSql": "SELECT relname AS \"テーブル\", n_live_tup AS \"行数\" FROM pg_stat_user_tables ORDER BY n_live_tup DESC LIMIT 10"
              }
            ]
          }
        ]
      }
